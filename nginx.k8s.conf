server {
    listen 80;
    server_name _;

    location /api/products {
        proxy_pass http://cloudcart-product-product-service.staging.svc.cluster.local:3001;
    }

    location /api/orders {
        proxy_pass http://cloudcart-order-order-service.staging.svc.cluster.local:3002;
    }

    location /api/customers {
        proxy_pass http://cloudcart-customer-customer-service.staging.svc.cluster.local:3003;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
