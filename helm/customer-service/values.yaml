replicaCount: 1

image:
  repository: 783722568260.dkr.ecr.ap-south-1.amazonaws.com/cloudcart-customer-service
  pullPolicy: Always
  tag: "metrics-v1"

service:
  type: ClusterIP
  port: 3003

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  timeoutSeconds: 5
  periodSeconds: 5
  failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""


ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: cloudcart.local
      paths:
        - path: /api/customers
          pathType: Prefix
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []


